name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: chmod gradlew
        run: chmod +x gradlew
      - name: Build Android APK + Desktop app
        run: ./gradlew :app-android:assembleDebug :app-desktop:classes --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
