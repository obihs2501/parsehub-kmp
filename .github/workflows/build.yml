name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: chmod gradlew
        run: chmod +x gradlew
      - name: Build Android APK + Desktop app
        run: ./gradlew :app-android:assembleDebug :app-desktop:classes --no-daemon --stacktrace
      - name: Verify launcher activity is packaged
        run: |
          set -euo pipefail
          APK=$(ls app-android/build/outputs/apk/debug/*.apk | head -1)
          echo "apk: $APK"
          CLI="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          ACT=$("$CLI" manifest print "$APK" | grep -oE 'android:name="[^"]+MainActivity"' | head -1 | cut -d'"' -f2)
          echo "launcher activity: $ACT"
          DEX=$(printf '%s' "$ACT" | tr '.' '/')
          if unzip -p "$APK" 'classes*.dex' | strings | grep -qF "L$DEX;"; then
            echo "OK: launcher class present in dex"
          else
            echo "FAIL: $DEX not found in dex"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distributable
        shell: bash
        run: ./gradlew :app-desktop:createDistributable --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-studio-windows
          path: app-desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
