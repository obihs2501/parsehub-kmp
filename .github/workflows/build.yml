name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Build Android and check legacy desktop compatibility
        run: |
          chmod +x gradlew
          ./gradlew :app-android:assembleDebug :app-desktop:classes --no-daemon --stacktrace
      - name: Verify launcher activity is packaged
        run: |
          set -euo pipefail
          APK=$(find app-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          CLI="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          ACT=$("$CLI" manifest print "$APK" | sed -n 's/.*android:name="\([^"]*MainActivity\)".*/\1/p' | head -1)
          test -n "$ACT"
          DEX=$(printf '%s' "$ACT" | tr '.' '/')
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/parsehub-dex.txt
          grep -qF "L$DEX;" /tmp/parsehub-dex.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared kernel and sidecar, package JVM service
        run: |
          chmod +x gradlew
          ./gradlew :kernel:desktopTest :sidecar:test :sidecar:fatJar --no-daemon --stacktrace
      - name: Check authenticated API and EOF shutdown
        run: python3 -I scripts/sidecar-smoke.py sidecar/build/libs/parsehub-sidecar.jar
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-sidecar
          path: sidecar/build/libs/parsehub-sidecar.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: |
            kernel/build/reports/tests/**
            sidecar/build/reports/tests/**
          retention-days: 7

  windows:
    needs: sidecar
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: parsehub-sidecar
          path: sidecar/build/libs
      - name: Stage bundled Java and sidecar
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Install locked frontend dependencies
        run: pnpm --dir studio install --frozen-lockfile
      - name: Build WebView frontend and NSIS installer
        run: pnpm --dir studio tauri build --bundles nsis
      - name: Check desktop startup and JVM shutdown
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: parsehub-studio-windows
          path: studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: |
            studio/src-tauri/Cargo.lock
            studio/src-tauri/target/release/desktop-smoke.log
            studio/src-tauri/target/release/smoke-data/**/sidecar-stderr.log
            studio/src-tauri/target/release/smoke-data/sidecar-stderr.log
          retention-days: 7
